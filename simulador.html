<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Simulador de recorte · Weliving · Meta $5.400M</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--pri:#4f46e5;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f1f5f9;color:var(--ink);font-size:14.5px;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 70px}
/* sticky header */
.sticky{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;margin:0 -12px 12px;padding:12px 14px 11px;box-shadow:0 6px 18px rgba(79,70,229,.28)}
.sticky h1{margin:0 0 2px;font-size:15px;font-weight:800}
.sticky .sub{font-size:11px;opacity:.85}
.kpis{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap}
.kbox{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:7px 11px;flex:1;min-width:120px}
.kbox .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.85}
.kbox .v{font-size:17px;font-weight:800;margin-top:1px}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;font-weight:800;font-size:12.5px}
.chip.ok{background:#dcfce7;color:#166534}
.chip.bad{background:#fee2e2;color:#991b1b}
.stack{display:flex;height:9px;border-radius:6px;overflow:hidden;margin-top:9px;background:rgba(255,255,255,.2)}
.stack span{display:block;height:100%}
.presets{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
.presets button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-weight:800;font-size:12px;cursor:pointer;color:var(--ink)}
.presets .p-meta{background:#ecfdf5;border-color:#a7f3d0;color:#166534}
.presets .p-eq{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.grp{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:11px;overflow:hidden}
.grph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;gap:10px}
.grph .gt{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.grph .gs{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
.grph .gr{text-align:right;flex-shrink:0}
.grph .gr .gv{font-weight:800;font-size:14px}
.grph .gr .ga{font-size:11px;font-weight:700}
.pos{color:var(--ok)} .neg{color:var(--bad)} .z{color:var(--mut)}
.bar{height:5px;background:#eef2f7}
.bar i{display:block;height:100%;background:var(--pri)}
.body{border-top:1px solid var(--line);display:none}
.grp.open .body{display:block}
.grp.open .grph .caret{transform:rotate(90deg)}
.caret{transition:transform .15s;color:var(--mut);font-size:12px}
.rw{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid #f1f5f9;flex-wrap:wrap}
.rw:first-child{border-top:none}
.rw .nm{flex:1;min-width:150px;font-size:13px}
.rw .nm .ej{font-size:10.5px;color:var(--warn);font-weight:700}
.rw .base{font-size:12px;color:var(--mut);min-width:78px;text-align:right}
.rw .tgt{font-weight:800;font-size:13px;min-width:82px;text-align:right}
.rw .sv{font-size:11.5px;font-weight:800;min-width:70px;text-align:right}
.qb{display:inline-flex;gap:3px}
.qb button{border:1px solid var(--line);background:#f8fafc;border-radius:7px;font-size:11px;font-weight:800;padding:5px 7px;cursor:pointer;color:var(--mut)}
.qb button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.qb button.x{color:var(--bad)}
.mi{width:66px;border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:12px;text-align:right;font-weight:700}
.rw.lock{opacity:.72}
.rw.lock .lk{font-size:10.5px;background:#f1f5f9;color:#475569;border-radius:5px;padding:2px 6px;font-weight:800}
.aptbar{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#f8fafc;border-top:1px solid var(--line)}
.aptbar input{flex:1;accent-color:var(--pri)}
.aptbar .v{font-weight:800;min-width:34px;text-align:right}
.note{color:var(--mut);font-size:12px;padding:9px 14px;background:#fbfdff}
.warnbox{background:#fffbeb;border-top:1px solid #fde68a;color:#92400e;font-size:11.5px;padding:9px 14px}
.foot{color:var(--mut);font-size:11px;text-align:center;margin-top:6px}
@media(max-width:640px){.rw .base{min-width:64px}.rw .nm{min-width:120px;flex-basis:100%}.mi{width:60px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="sticky">
    <h1>🎯 Recorte de presupuesto · Weliving</h1>
    <div class="sub">Ajusta línea por línea. <b>No toca la base</b> — solo simula el camino a la meta.</div>
    <div class="kpis">
      <div class="kbox"><div class="l">Gran total simulado</div><div class="v" id="hGran">—</div></div>
      <div class="kbox" style="flex:0 0 auto"><div class="l">Meta</div><div class="v">$5.400M</div></div>
      <div id="hChip"></div>
    </div>
    <div class="stack" id="stack"></div>
  </div>

  <div class="presets">
    <span style="align-self:center;font-size:11.5px;color:#475569;font-weight:800">Escenarios:</span>
    <button class="p-base" onclick="preset('base')">↺ Base</button>
    <button class="p-eq" onclick="preset('eq')">⚖️ Equilibrado</button>
    <button class="p-meta" onclick="preset('meta')">🎯 Llegar a $5.400M</button>
  </div>

  <div id="groups"></div>
  <div class="foot" id="src">Base real de la plataforma (snapshot). Actualizando en vivo…</div>
</div>

<script>
var META=5400000000;
/* ===== BASE REAL (snapshot presupuesto_caps + dotacion_airbnb · 20 aptos) ===== */
var LOTE=1915000000;
var ESTR={total:1198861376,ejec:752289403}; // obra negra · bloqueada
var GRIS=[
 {num:'13',nom:'Red eléctrica',ppto:152190000,ejec:0},
 {num:'11',nom:'Redes hidráulicas',ppto:130408000,ejec:0},
 {num:'9',nom:'Drywall / superboard (muros y cielos)',ppto:104456000,ejec:0},
 {num:'15',nom:'Red contra incendio (RCI)',ppto:67120000,ejec:0},
 {num:'12',nom:'Redes sanitarias',ppto:52788000,ejec:0},
 {num:'16',nom:'Gas',ppto:35800000,ejec:0},
 {num:'14',nom:'Red de datos / CCTV / control acceso',ppto:35660000,ejec:0},
 {num:'8',nom:'Pañetes / revoques / morteros',ppto:29718000,ejec:0},
 {num:'10',nom:'Impermeabilizaciones',ppto:21225000,ejec:0}
];
var BLANCA=[
 {num:'23',nom:'Fachada premium y ventanería',ppto:320000000,ejec:0,lujo:1},
 {num:'17',nom:'Ascensor',ppto:168700000,ejec:0},
 {num:'18',nom:'Pisos y enchapes',ppto:121534000,ejec:0},
 {num:'35',nom:'Mano de obra — obra blanca',ppto:98086721,ejec:0},
 {num:'21',nom:'Cocinas / cocinetas',ppto:96300000,ejec:0},
 {num:'28',nom:'Rooftop social',ppto:67300000,ejec:0,lujo:1},
 {num:'6',nom:'Nivel 1 comercial',ppto:58583000,ejec:0},
 {num:'22',nom:'Carpintería (puertas y closets)',ppto:57180000,ejec:0},
 {num:'5',nom:'Semisótano (acabados técnicos)',ppto:55595000,ejec:0},
 {num:'31',nom:'Urbanismo, antejardín y acceso',ppto:54880000,ejec:0},
 {num:'19',nom:'Aparatos y accesorios sanitarios',ppto:47400000,ejec:0},
 {num:'24',nom:'Pintura',ppto:45230000,ejec:0},
 {num:'29',nom:'Jacuzzi rooftop',ppto:44000000,ejec:0,lujo:1},
 {num:'25',nom:'Iluminación arquitectónica LED',ppto:39000000,ejec:0,lujo:1},
 {num:'26',nom:'Zonas comunes',ppto:38000000,ejec:0},
 {num:'27',nom:'Rooftop técnico',ppto:37177600,ejec:0},
 {num:'30',nom:'Pérgola rooftop',ppto:21370000,ejec:0,lujo:1},
 {num:'33',nom:'Aseo y entrega',ppto:21342400,ejec:0},
 {num:'20',nom:'Cabinas / divisiones de ducha',ppto:13200000,ejec:0},
 {num:'32',nom:'Equipos especiales',ppto:8500000,ejec:0}
];
var IND=[
 {num:'36',nom:'Administración (6%)',ppto:90000000,ejec:100765605,fijoNota:1},
 {num:'37',nom:'Imprevistos (4%)',ppto:115620379,ejec:0}
];
var DOT=[
 {cat:'Electrodomésticos',ap:7720000,co:0},
 {cat:'Dormitorio',ap:5940000,co:0},
 {cat:'Sala / Comedor',ap:3520000,co:0},
 {cat:'Tecnología y Seguridad',ap:2560000,co:0},
 {cat:'Cocina / Menaje',ap:2014000,co:0},
 {cat:'Zonas Comunes (1 vez)',ap:0,co:34340000},
 {cat:'Baño',ap:1272000,co:0},
 {cat:'Decoración y Confort',ap:1240000,co:0},
 {cat:'Aseo y Consumibles',ap:748000,co:0}
];

/* ===== ESTADO ===== */
var T={};          // targets por num (caps + ind)
var APTS=20;
var DP={};         // % por categoría dotación (0..1)
function initState(){
  GRIS.concat(BLANCA).concat(IND).forEach(function(c){T[c.num]=c.ppto;});
  DOT.forEach(function(d){DP[d.cat]=1;});
  APTS=20;
}

/* ===== FORMATO ===== */
function fmt(v){return '$'+Math.round(v||0).toLocaleString('es-CO');}
function fM(v){return '$'+(Math.round(v/1e5)/10).toLocaleString('es-CO')+'M';}

/* ===== CÁLCULO ===== */
function grisTot(){return GRIS.reduce(function(a,c){return a+T[c.num];},0);}
function blancaTot(){return BLANCA.reduce(function(a,c){return a+T[c.num];},0);}
function indTot(){return IND.reduce(function(a,c){return a+T[c.num];},0);}
function dotCat(d){return (d.ap*APTS+d.co)*DP[d.cat];}
function dotTot(){return DOT.reduce(function(a,d){return a+dotCat(d);},0);}
function granTot(){return LOTE+ESTR.total+grisTot()+blancaTot()+indTot()+dotTot();}
/* bases */
var grisBase=GRIS.reduce(function(a,c){return a+c.ppto;},0);
var blancaBase=BLANCA.reduce(function(a,c){return a+c.ppto;},0);
var indBase=IND.reduce(function(a,c){return a+c.ppto;},0);
var dotBase=DOT.reduce(function(a,d){return a+(d.ap*20+d.co);},0);
var granBase=LOTE+ESTR.total+grisBase+blancaBase+indBase+dotBase;

/* ===== RENDER ===== */
function saveM(num,el){var v=parseFloat((el.value||'').toString().replace(',','.'));if(isNaN(v)||v<0)v=0;var c=findCap(num);var fl=c?c.ejec:0;var t=Math.round(v*1e6);if(t<fl)t=fl;T[num]=t;render();}
function findCap(num){return GRIS.concat(BLANCA).concat(IND).filter(function(c){return c.num===num;})[0];}
function quick(num,f){var c=findCap(num);var fl=c.ejec||0;var t=(f==null)?c.ppto:Math.round(c.ppto*f);if(t<fl)t=fl;T[num]=t;render();}
function dotQuick(cat,p){DP[cat]=p;render();}

function capRow(c){
  var t=T[c.num],base=c.ppto,sv=base-t,pct=t/base;
  var qb='<span class="qb">'+
    '<button class="'+(Math.abs(pct-1)<0.001?'on':'')+'" onclick="quick(\''+c.num+'\',null)">100%</button>'+
    '<button class="'+(Math.abs(pct-0.85)<0.001?'on':'')+'" onclick="quick(\''+c.num+'\',0.85)">−15%</button>'+
    '<button class="'+(Math.abs(pct-0.75)<0.001?'on':'')+'" onclick="quick(\''+c.num+'\',0.75)">−25%</button>'+
    '<button class="x '+(t===(c.ejec||0)&&base>0?'on':'')+'" onclick="quick(\''+c.num+'\',0)">×0</button></span>';
  var ej=c.ejec>0?'<span class="ej"> · ejec '+fM(c.ejec)+'</span>':'';
  var lujo=c.lujo?' 💎':'';
  return '<div class="rw"><div class="nm">'+c.nom+lujo+ej+'</div>'+
    '<div class="base">'+fM(base)+'</div>'+qb+
    '<input class="mi" value="'+(Math.round(t/1e4)/100)+'" onchange="saveM(\''+c.num+'\',this)" title="millones">'+
    '<div class="sv '+(sv>0?'pos':'z')+'">'+(sv>0?'−'+fM(sv):'—')+'</div></div>';
}
function dotRow(d){
  var cur=dotCat(d),full=d.ap*APTS+d.co,sv=full/DP[d.cat]*1-cur; // sv vs 100% at current apts
  var base20=d.ap*20+d.co, svVs20=base20-cur;
  var p=DP[d.cat];
  var qb='<span class="qb">'+
    [1,0.75,0.5,0].map(function(x){return '<button class="'+(x===0?'x ':'')+(Math.abs(p-x)<0.001?'on':'')+'" onclick="dotQuick(\''+d.cat+'\','+x+')">'+(x===0?'×0':Math.round(x*100)+'%')+'</button>';}).join('')+
    '</span>';
  var perN=d.ap>0?('$'+(d.ap/1e6).toFixed(2).replace('.00','')+'M/apto'):'común';
  return '<div class="rw"><div class="nm">'+d.cat+' <span class="ej" style="color:var(--mut)">'+perN+'</span></div>'+
    '<div class="base">'+fM(base20)+'</div>'+qb+
    '<div class="tgt">'+fM(cur)+'</div>'+
    '<div class="sv '+(svVs20>0?'pos':'z')+'">'+(svVs20>0?'−'+fM(svVs20):'—')+'</div></div>';
}

function group(id,titulo,icon,rowsHtml,base,cur,openDefault,extraTop,warn){
  var sv=base-cur,pct=base?Math.round(cur/base*100):0;
  var ar='<span class="ga '+(sv>0?'pos':'z')+'">'+(sv>0?'ahorro −'+fM(sv):'sin recorte')+'</span>';
  return '<div class="grp'+(openDefault?' open':'')+'" id="g_'+id+'">'+
    '<div class="grph" onclick="tog(\''+id+'\')">'+
      '<div><div class="gt"><span class="caret">▸</span>'+icon+' '+titulo+'</div><div class="gs">base '+fM(base)+' → simulado '+fM(cur)+'</div></div>'+
      '<div class="gr"><div class="gv">'+fM(cur)+'</div>'+ar+'</div></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="body">'+(extraTop||'')+rowsHtml+(warn||'')+'</div></div>';
}
function tog(id){document.getElementById('g_'+id).classList.toggle('open');}

function render(){
  var gran=granTot(),delta=gran-META;
  document.getElementById('hGran').textContent=fmt(gran);
  document.getElementById('hChip').innerHTML=delta<=0?'<span class="chip ok">✓ '+fM(-delta)+' bajo la meta</span>':'<span class="chip bad">falta −'+fM(delta)+'</span>';
  // stack
  var parts=[['Lote',LOTE,'#334155'],['Estructura',ESTR.total,'#111827'],['Redes',grisTot(),'#0ea5a3'],['Acabados',blancaTot(),'#7c3aed'],['Indirectos',indTot(),'#d97706'],['Dotación',dotTot(),'#16a34a']];
  document.getElementById('stack').innerHTML=parts.map(function(p){return '<span style="width:'+(p[1]/gran*100)+'%;background:'+p[2]+'" title="'+p[0]+' '+fmt(p[1])+'"></span>';}).join('');
  // groups
  var openG=window._open||{gris:false,blanca:true,ind:false,dot:true};
  var lockLote='<div class="rw lock"><div class="nm">Terreno y legales <span class="lk">🔒 fijo</span></div><div class="base">'+fM(LOTE)+'</div><div style="flex:1"></div><div class="tgt">'+fM(LOTE)+'</div><div class="sv z">—</div></div>';
  var lockEstr='<div class="rw lock"><div class="nm">Estructura completa (losas, columnas, cimentación) <span class="lk">🔒 63% ejecutado</span></div><div class="base">'+fM(ESTR.total)+'</div><div style="flex:1"></div><div class="tgt">'+fM(ESTR.total)+'</div><div class="sv z">—</div></div>';
  var apt='<div class="aptbar"><span style="font-weight:700;font-size:12.5px">Apartamentos amoblados</span><input type="range" min="0" max="20" step="1" value="'+APTS+'" oninput="APTS=+this.value;document.getElementById(\'aptV\').textContent=APTS;render()"><span class="v" id="aptV">'+APTS+'</span></div>';
  var indWarn='<div class="warnbox">Indirectos ya consumió ≈$148.9M (admin + varios). El recorte real sale del colchón de imprevistos no usado.</div>';
  var html='';
  html+=group('lote','Lote y legales','🏦',lockLote,LOTE,LOTE,false);
  html+=group('estr','Estructura · obra negra','🧱',lockEstr,ESTR.total,ESTR.total,false,'<div class="note">Ya va 63% construida ($752M gastado). No se recorta — regla de oro.</div>');
  html+=group('gris','Redes · obra gris','🔧',GRIS.map(capRow).join(''),grisBase,grisTot(),openG.gris);
  html+=group('blanca','Acabados · obra blanca','🎨',BLANCA.map(capRow).join(''),blancaBase,blancaTot(),openG.blanca,'<div class="note">$0 ejecutado — 100% flexible. 💎 = ítem premium / lujo.</div>');
  html+=group('ind','Indirectos','📋',IND.map(capRow).join(''),indBase,indTot(),openG.ind,'',indWarn);
  html+=group('dot','Dotación mueble','🛋',DOT.map(dotRow).join(''),dotBase,dotTot(),openG.dot,apt);
  document.getElementById('groups').innerHTML=html;
}

/* preservar estado abierto/cerrado */
document.addEventListener('click',function(e){var g=e.target.closest&&e.target.closest('.grp');if(!g)return;setTimeout(function(){window._open={gris:isOpen('gris'),blanca:isOpen('blanca'),ind:isOpen('ind'),dot:isOpen('dot')};},0);});
function isOpen(id){var el=document.getElementById('g_'+id);return el?el.classList.contains('open'):false;}

/* ===== PRESETS ===== */
function preset(p){
  initState();
  if(p==='eq'){
    // recorte moderado: acabados -15%, lujos recortados, dotación estándar, imprevistos 3%
    T['23']=200000000;T['25']=22000000;               // fachada / iluminación
    ['18','21','24','19','22','5','6','31','26','33'].forEach(function(n){var c=findCap(n);T[n]=Math.round(c.ppto*0.85);});
    T['37']=Math.round(115620379*0.75);
    DOT.forEach(function(d){DP[d.cat]=0.78;});DP['Zonas Comunes (1 vez)']=1;
  } else if(p==='meta'){
    // agresivo: quitar lujos rooftop, fachada/ascensor/iluminación estándar, acabados -15%, gris -7%, dotación básica, imprevistos 3%
    T['23']=200000000;T['17']=130000000;T['28']=40000000;T['29']=0;T['30']=0;T['25']=22000000;
    ['18','21','24','19','22','5','6','31','26','33','27','20','32','35'].forEach(function(n){var c=findCap(n);T[n]=Math.round(c.ppto*0.85);});
    GRIS.forEach(function(c){T[c.num]=Math.round(c.ppto*0.93);});
    T['37']=Math.round(115620379*0.75);
    DOT.forEach(function(d){DP[d.cat]=0.60;});DP['Zonas Comunes (1 vez)']=0.6;
  }
  window._open={gris:true,blanca:true,ind:false,dot:true};
  render();
}

/* ===== LIVE REFRESH (no escribe) ===== */
var SB_URL='https://dghmgaaprlzpfnpsqzav.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnaG1nYWFwcmx6cGZucHNxemF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzcyMDQsImV4cCI6MjA5NzIxMzIwNH0.kPTDqFX1AaXlxI2G9V9S46KDMWb6Y6tHoMwe0Fujk7k';
function g(u){return fetch(SB_URL+'/rest/v1/'+u,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},cache:'no-store'}).then(function(r){return r.json();});}
function refresh(){
  Promise.all([g('presupuesto_caps?obra_id=eq.weliving&select=num,ppto&limit=200'),g('dotacion_airbnb?select=categoria,es_comun,cant_apto,precio&limit=500')])
  .then(function(a){
    var caps=a[0]||[],dot=a[1]||[];if(!caps.length)return;
    var by={};caps.forEach(function(c){by[String(c.num)]=+c.ppto||0;});
    GRIS.concat(BLANCA).concat(IND).forEach(function(c){if(by[c.num]!=null&&by[c.num]>0){c.ppto=by[c.num];}});
    // dotación por categoría
    var m={};dot.forEach(function(d){var k=d.categoria;m[k]=m[k]||{ap:0,co:0};var v=(+d.precio||0)*(+d.cant_apto||0);if(d.es_comun)m[k].co+=v;else m[k].ap+=v;});
    DOT.forEach(function(d){if(m[d.cat]){d.ap=m[d.cat].ap;d.co=m[d.cat].co;}});
    grisBase=GRIS.reduce(function(a,c){return a+c.ppto;},0);blancaBase=BLANCA.reduce(function(a,c){return a+c.ppto;},0);
    indBase=IND.reduce(function(a,c){return a+c.ppto;},0);dotBase=DOT.reduce(function(a,d){return a+(d.ap*20+d.co);},0);
    granBase=LOTE+ESTR.total+grisBase+blancaBase+indBase+dotBase;
    initState();render();
    document.getElementById('src').textContent='Datos en vivo · base $'+Math.round(granBase).toLocaleString('es-CO')+' (obra + dotación 20 aptos)';
  }).catch(function(){document.getElementById('src').textContent='Sin conexión — usando snapshot de la base.';});
}

initState();render();refresh();
</script>
</body>
