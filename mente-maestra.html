<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imperio · Mente Maestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--panel:#161922;--panel2:#1d212c;--line:#2a2f3b;--txt:#eef1f6;--mut:#98a0af;
 --gold:#c9a24a;--gold2:#e6c579;--ok:#5cc08a;--amb:#e0b64a;--red:#e0645a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:26px 20px 40px;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-size:11px;letter-spacing:5px;color:var(--mut);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill.alert{color:var(--gold2);border-color:#5a4a24}.pill.alert .d{background:var(--red);box-shadow:0 0 8px rgba(224,100,90,.6)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}h1 span{color:var(--gold)}
.date{color:var(--mut);font-size:13px;margin-top:3px}
.hd{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
.stat .l{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.3px}
.stat .v{font-size:23px;font-weight:800;margin-top:6px}
.stat .s{font-size:11px;color:var(--mut);margin-top:3px}
.stat.gold{border-left:3px solid var(--gold)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold2);font-weight:700;margin:26px 0 13px}
.obras{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.obra{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;text-decoration:none;color:inherit;display:block;transition:.15s}
.obra:hover{border-color:var(--gold);transform:translateY(-2px)}
.obra .nm{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;margin-left:auto}
.b-viva{background:rgba(92,192,138,.16);color:var(--ok)}.b-dorm{background:#242a36;color:var(--mut)}
.obra .bar{height:6px;background:#242a36;border-radius:20px;margin:14px 0 6px;overflow:hidden}
.obra .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:20px}
.obra .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.obra .meta b{color:var(--txt);font-weight:700}
.focos{display:flex;flex-direction:column;gap:9px}
.foco{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.foco .t{font-weight:600;font-size:13.5px}.foco .a{font-size:11.5px;color:var(--mut);margin-top:2px}
.foco .tag{font-size:10px;font-weight:700;color:var(--red);background:rgba(224,100,90,.14);padding:3px 9px;border-radius:20px;white-space:nowrap}
.calma{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mut)}
.calma .big{font-size:30px;margin-bottom:8px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.links a{color:var(--mut);text-decoration:none;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);transition:.15s}
.links a:hover{color:var(--txt);border-color:var(--gold)}
.links a.main{background:var(--gold);color:#0d0f14;border-color:var(--gold)}
.loading{text-align:center;color:var(--mut);padding:40px;font-size:14px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:22px}}
</style></head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">IMPERIO · CONSTRUCTORA</div>
    <div class="pill" id="pill"><span class="d"></span><span id="pilltx">leyendo…</span></div>
  </div>
  <div class="hd">
    <h1>Mente <span>Maestra</span></h1>
    <div class="date" id="fecha"></div>
  </div>

  <div class="stats" id="stats"><div class="loading">Leyendo tu imperio…</div></div>

  <h2>Obras</h2>
  <div class="obras" id="obras"></div>

  <h2>Focos que atender</h2>
  <div id="focos"></div>

  <div class="links">
    <a class="main" href="panel.html">Panel completo</a>
    <a href="flujo.html">Flujo de caja</a>
    <a href="requisiciones.html">Requisiciones</a>
    <a href="nomina.html">Nómina</a>
    <a href="bitacora.html">Bitácora</a>
    <a href="sst.html">SST</a>
  </div>
</div>

<script>
var SB='https://dghmgaaprlzpfnpsqzav.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnaG1nYWFwcmx6cGZucHNxemF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzcyMDQsImV4cCI6MjA5NzIxMzIwNH0.kPTDqFX1AaXlxI2G9V9S46KDMWb6Y6tHoMwe0Fujk7k';
var Hh={apikey:KEY,Authorization:'Bearer '+KEY};
function q(t,query){return fetch(SB+'/rest/v1/'+t+'?'+(query||''),{headers:Hh,cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];});}
function short(n){return n>=1e6?'$'+(n/1e6).toFixed(1).replace('.0','')+'M':'$'+Math.round(n||0).toLocaleString('es-CO');}
function abierto(e){return e!=='cerrado'&&e!=='mitigado'&&e!=='resuelta'&&e!=='resuelto';}
var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var hoy=new Date();
document.getElementById('fecha').textContent='Estado del imperio · '+hoy.getDate()+' de '+meses[hoy.getMonth()]+' '+hoy.getFullYear();
var OBRAINFO={
  weliving:{ico:'\u{1F3D7}',meta:5000000000,gasto:912872232,avance:45,etapa:'Estructura · losa P6'},
  robledo :{ico:'\u{1F3E0}',meta:740000000, gasto:310189112,avance:55,etapa:'Mampostería'},
  novaeva :{ico:'\u{1F3E2}',meta:null,      gasto:70738151, avance:95,etapa:'Acabados finales'}
};
Promise.all([
  q('cuentas','select=saldo_actual,es_personal,activa,deleted_at'),
  q('pasivos','select=monto,pagado,estado,deleted_at'),
  q('deudores','select=monto'),
  q('matriz_riesgos','select=area_id,estado,riesgo,severidad'),
  q('areas','select=id,nombre'),
  q('obras','select=id,nombre,estado,activa,orden&order=orden')
]).then(function(res){
  var cuentas=res[0]||[],pasivos=res[1]||[],deudores=res[2]||[],riesgos=res[3]||[],areas=res[4]||[],obras=res[5]||[];
  var caja=cuentas.filter(function(c){return c.activa&&!c.es_personal&&!c.deleted_at;}).reduce(function(s,c){return s+(Number(c.saldo_actual)||0);},0);
  var porPagar=pasivos.filter(function(p){return !p.deleted_at&&p.estado!=='pagado'&&!p.pagado;}).reduce(function(s,p){return s+(Number(p.monto)||0);},0);
  var porCobrar=deudores.reduce(function(s,d){return s+(Number(d.monto)||0);},0);
  var focos=riesgos.filter(function(r){return abierto(r.estado);});
  var areaNm={};areas.forEach(function(a){areaNm[a.id]=a.nombre;});
  var pill=document.getElementById('pill');
  if(focos.length){pill.className='pill alert';document.getElementById('pilltx').textContent=focos.length+' foco'+(focos.length>1?'s':'')+' que atender';}
  else{document.getElementById('pilltx').textContent='En calma';}
  document.getElementById('stats').innerHTML=[
    {l:'Caja disponible',v:short(caja),s:'cuentas de empresa',g:true},
    {l:'Por cobrar',v:short(porCobrar),s:'cartera y socios'},
    {l:'Por pagar',v:short(porPagar),s:'pasivos vigentes'},
    {l:'Focos abiertos',v:focos.length,s:focos.length?'requieren tu atención':'todo en calma'}
  ].map(function(k){return '<div class="stat'+(k.g?' gold':'')+'"><div class="l">'+k.l+'</div><div class="v">'+k.v+'</div><div class="s">'+k.s+'</div></div>';}).join('');
  var ob=obras.length?obras:[{id:'weliving',nombre:'Weliving',activa:true},{id:'robledo',nombre:'Robledo',activa:true},{id:'novaeva',nombre:'Novaeva',activa:true}];
  document.getElementById('obras').innerHTML=ob.map(function(o){
    var inf=OBRAINFO[o.id]||{ico:'\u{1F3D7}',avance:0,etapa:''};
    var act=(o.activa||o.estado==='activa'||o.estado==='ejecucion');
    var badge=act?'<span class="badge b-viva">Activa</span>':'<span class="badge b-dorm">'+(o.estado||'—')+'</span>';
    var metaTxt=inf.meta?('<span>Meta <b>'+short(inf.meta)+'</b></span>'):'<span></span>';
    return '<a class="obra" href="panel.html#'+o.id+'"><div class="nm">'+inf.ico+' '+(o.nombre||o.id)+badge+'</div>'
      +'<div class="bar"><i style="width:'+(inf.avance||0)+'%"></i></div>'
      +'<div class="meta"><span>'+(inf.etapa||'')+'</span><b>'+(inf.avance||0)+'%</b></div>'
      +'<div class="meta" style="margin-top:6px">'+metaTxt+'<span>Gastado <b>'+short(inf.gasto||0)+'</b></span></div></a>';
  }).join('');
  var fx=document.getElementById('focos');
  if(!focos.length){fx.innerHTML='<div class="calma"><div class="big">✅</div>Todo en calma. Sin focos abiertos hoy.</div>';}
  else{
    focos.sort(function(a,b){return (b.severidad||0)-(a.severidad||0);});
    fx.innerHTML='<div class="focos">'+focos.map(function(r){
      return '<div class="foco"><div><div class="t">'+(r.riesgo||'Riesgo')+'</div><div class="a">'+(areaNm[r.area_id]||'Área')+'</div></div><span class="tag">Atender</span></div>';
    }).join('')+'</div>';
  }
}).catch(function(){document.getElementById('stats').innerHTML='<div class="loading">No pude leer tu imperio. Recarga.</div>';});
</script>
</body></html>
