<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<title>Imperio · Mente Maestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24a;--gold2:#e6c579;--ok:#5cc08a;--red:#f2708a;--node:#cdd6f7;--lbl:#e9ecff;--mut:#8b93b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#080a1a;color:#fff;font-family:Inter,-apple-system,sans-serif;position:relative}
#bg{position:fixed;inset:0;background:
 radial-gradient(1200px 950px at 50% 54%,#1a1c44 0%,#0f1030 42%,#080a1a 78%);z-index:0}
#grid{position:fixed;inset:0;z-index:0;opacity:.5;
 background-image:linear-gradient(rgba(120,130,200,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,130,200,.045) 1px,transparent 1px);
 background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 54%,#000 30%,transparent 72%);mask-image:radial-gradient(circle at 50% 54%,#000 30%,transparent 72%)}
canvas,#syn{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.head{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:20px 26px}
.brand{font-size:11px;letter-spacing:6px;color:var(--mut);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.alert{color:var(--gold2);border-color:rgba(201,162,74,.4)}.pill.alert .d{background:var(--red);box-shadow:0 0 10px var(--red)}
.title{position:fixed;top:70px;left:0;right:0;text-align:center;z-index:6;pointer-events:none}
.title .k{font-size:10px;letter-spacing:7px;color:var(--gold);font-weight:700}
.title h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;letter-spacing:1px;margin-top:2px;color:#fff}
.coreLbl{position:fixed;left:50%;top:54%;transform:translate(-50%,-50%);z-index:5;text-align:center;pointer-events:none}
.coreLbl .n{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:4px;color:#fff;text-shadow:0 0 20px rgba(201,162,74,.6);line-height:1.3}
.coreLbl .s{font-size:9px;letter-spacing:3px;color:var(--gold);margin-top:3px}
.dept{position:absolute;transform:translate(-50%,-50%);z-index:5;text-align:center;cursor:pointer;pointer-events:auto}
.dept .lb{font-size:15px;letter-spacing:4px;font-weight:700;color:var(--lbl);white-space:nowrap;text-shadow:0 2px 12px #080a1a}
.dept .sb{font-size:9.5px;letter-spacing:1.5px;color:var(--mut);margin-top:4px;white-space:nowrap}
.dept .val{font-size:11px;color:var(--gold2);font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.dept:hover .lb{color:#fff}.dept.alert .lb{color:var(--gold2)}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px 20px 22px}
.foot a{color:var(--mut);text-decoration:none;font-size:12px;font-weight:600;padding:8px 15px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:.18s;backdrop-filter:blur(8px)}
.foot a:hover{color:#fff;border-color:var(--gold)}.foot a.main{background:var(--gold);color:#0b0b1e;border-color:var(--gold)}
.tip{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:7;background:rgba(16,18,42,.94);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 18px;min-width:220px;text-align:center;display:none;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.tip b{font-size:15px;letter-spacing:1px}.tip .s{font-size:12px;color:var(--mut);margin-top:5px}
@media(max-width:680px){.title h1{font-size:26px}.dept .lb{font-size:12px;letter-spacing:2px}.dept .sb{display:none}}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<canvas id="core"></canvas>
<svg id="syn"><g id="lines"></g><g id="pulses"></g></svg>
<div class="head">
  <div class="brand">IMPERIO · CONSTRUCTORA</div>
  <div class="pill" id="pill"><span class="d"></span><span id="pilltx">leyendo…</span></div>
</div>
<div class="title"><div class="k">MENTE MAESTRA</div><h1>El estado de tu imperio</h1></div>
<div class="coreLbl"><div class="n">IMPERIO</div><div class="s" id="coreStat">· en vivo ·</div></div>
<div id="depts"></div>
<div class="tip" id="tip"></div>
<div class="foot">
  <a class="main" href="panel.html">Panel completo</a>
  <a href="flujo.html">Flujo</a><a href="requisiciones.html">Requisiciones</a>
  <a href="nomina.html">Nómina</a><a href="bitacora.html">Bitácora</a><a href="sst.html">SST</a>
</div>
<script>
var SB='https://dghmgaaprlzpfnpsqzav.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnaG1nYWFwcmx6cGZucHNxemF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzcyMDQsImV4cCI6MjA5NzIxMzIwNH0.kPTDqFX1AaXlxI2G9V9S46KDMWb6Y6tHoMwe0Fujk7k';
var Hh={apikey:KEY,Authorization:'Bearer '+KEY};
function q(t,qr){return fetch(SB+'/rest/v1/'+t+'?'+(qr||''),{headers:Hh,cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];});}
function short(n){return n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(0)+'M':'$'+Math.round(n||0).toLocaleString('es-CO');}
function abierto(e){return e!=='cerrado'&&e!=='mitigado'&&e!=='resuelta'&&e!=='resuelto';}

// ── Áreas del imperio (constelación) ──
var DEPTS=[
 {id:'direccion',lb:'DIRECCIÓN',sb:'estado · caja · decisiones',href:'panel.html',key:true},
 {id:'obra',lb:'OBRA',sb:'bitácora · avance · planner',href:'bitacora.html'},
 {id:'presupuesto',lb:'PRESUPUESTO',sb:'apu · capítulos · real',href:'presupuesto.html'},
 {id:'tesoreria',lb:'TESORERÍA',sb:'caja · pagos · flujo',href:'flujo.html'},
 {id:'compras',lb:'COMPRAS',sb:'requisiciones · proveedores',href:'requisiciones.html'},
 {id:'talento',lb:'TALENTO',sb:'nómina · asistencia',href:'nomina.html'},
 {id:'sst',lb:'SST',sb:'seguridad · dotación · alturas',href:'sst.html'}
];
var LN=document.getElementById('lines'),PU=document.getElementById('pulses'),SVG=document.getElementById('syn');
var W,H,CX,CY,hubs=[],pulses=[];
var deptData={};

function rnd(seed){var x=Math.sin(seed*997.13)*43758.5453;return x-Math.floor(x);}
function branch(x,y,ang,len,depth,seed,col,pts){
  if(depth<=0||len<6)return;
  var nx=x+Math.cos(ang)*len,ny=y+Math.sin(ang)*len;
  pts.push({x1:x,y1:y,x2:nx,y2:ny,col:col});
  var n=depth>3?3:2;
  for(var i=0;i<n;i++){
    var spread=(rnd(seed+i*7.7)-0.5)*0.9;
    branch(nx,ny,ang+spread,len*(0.62+rnd(seed+i*3.3)*0.2),depth-1,seed+i*13.1+1,col,pts);
  }
  var r=depth>3?2.6:depth>1?1.7:1.1;
  pts.push({node:true,x:nx,y:ny,r:r,col:col});
}

function build(){
  W=window.innerWidth;H=window.innerHeight;CX=W/2;CY=H*0.50;
  SVG.setAttribute('viewBox','0 0 '+W+' '+H);
  var M=Math.min(W,H);
  var Rx=(W<680?M*0.30:M*0.34), Ry=(W<680?M*0.26:M*0.19);
  var Lx=Rx*1.45, Ly=Ry*(W<680?1.55:1.9);
  hubs=[];var linesHTML='';var n=DEPTS.length;
  DEPTS.forEach(function(d,i){
    var ang=(i/n)*Math.PI*2-Math.PI/2+Math.PI/n;
    var hx=CX+Math.cos(ang)*Rx,hy=CY+Math.sin(ang)*Ry;
    var dir=Math.atan2(hy-CY,hx-CX);
    var dd=deptData[d.id]||{};
    var alert=dd.alert;
    var col=d.key?'#c9a24a':(alert?'#f2708a':'rgba(170,182,235,.55)');
    hubs.push({x:hx,y:hy,ang:ang,col:d.key?'#e6c579':(alert?'#f2708a':'#cdd6f7')});
    linesHTML+='<line x1="'+CX+'" y1="'+CY+'" x2="'+hx+'" y2="'+hy+'" stroke="'+(alert?'rgba(242,112,138,.35)':d.key?'rgba(201,162,74,.4)':'rgba(150,162,220,.22)')+'" stroke-width="'+(d.key?1.1:0.8)+'"/>';
    var pts=[];
    branch(hx,hy,dir,Rx*0.30,5,i*100+7,col,pts);
    pts.forEach(function(p){
      if(p.node){linesHTML+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+p.r+'" fill="'+(alert?'#f2708a':d.key?'#e6c579':'#cdd6f7')+'" opacity="'+(0.35+p.r*0.16)+'"/>';}
      else{linesHTML+='<line x1="'+p.x1+'" y1="'+p.y1+'" x2="'+p.x2+'" y2="'+p.y2+'" stroke="'+p.col+'" stroke-width="0.55" opacity=".5"/>';}
    });
    linesHTML+='<circle cx="'+hx+'" cy="'+hy+'" r="'+(d.key?7:5.5)+'" fill="none" stroke="'+(alert?'#f2708a':d.key?'#e6c579':'#aab6eb')+'" stroke-width="1.4" opacity=".9"/>';
    linesHTML+='<circle cx="'+hx+'" cy="'+hy+'" r="'+(d.key?3:2.4)+'" fill="'+(alert?'#f2708a':d.key?'#e6c579':'#cdd6f7')+'"/>';
    var lx=CX+Math.cos(ang)*Lx,ly=CY+Math.sin(ang)*Ly;
    d._lx=lx;d._ly=ly;d._hx=hx;d._hy=hy;
  });
  LN.innerHTML=linesHTML;
  renderDepts();
  pulses=hubs.map(function(h,i){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',h.col==='#e6c579'?2.4:1.8);c.setAttribute('fill',h.col);c.setAttribute('opacity','.85');PU.appendChild(c);return {c:c,t:(i*0.14)%1,sp:0.004+i*0.0006,h:h};});
}
function renderDepts(){
  document.getElementById('depts').innerHTML=DEPTS.map(function(d){
    var dd=deptData[d.id]||{};
    var val=dd.val?'<div class="val">'+dd.val+'</div>':'';
    return '<div class="dept'+(dd.alert?' alert':'')+'" style="left:'+d._lx+'px;top:'+d._ly+'px" onclick="location.href=\''+d.href+'\'" onmouseenter="showTip(\''+d.id+'\')" onmouseleave="hideTip()"><div class="lb">'+d.lb+'</div><div class="sb">'+d.sb+'</div>'+val+'</div>';
  }).join('');
}
function showTip(id){var d=DEPTS.filter(function(x){return x.id===id;})[0];var dd=deptData[id]||{};var t=document.getElementById('tip');t.style.display='block';t.innerHTML='<b>'+d.lb+'</b><div class="s">'+(dd.tip||d.sb)+'</div>';}
function hideTip(){document.getElementById('tip').style.display='none';}

var cv=document.getElementById('core'),cx=cv.getContext('2d'),parts=[];
function initCore(){cv.width=W;cv.height=H;parts=[];for(var i=0;i<120;i++){var a=Math.random()*Math.PI*2,rr=Math.pow(Math.random(),0.6)*Math.min(W,H)*0.13;parts.push({a:a,r:rr,sp:0.002+Math.random()*0.006,sz:Math.random()*1.6+0.4,tw:Math.random()*Math.PI*2});}}
function drawCore(){cx.clearRect(0,0,W,H);
  var g=cx.createRadialGradient(CX,CY,0,CX,CY,Math.min(W,H)*0.16);g.addColorStop(0,'rgba(201,162,74,.28)');g.addColorStop(.4,'rgba(150,120,200,.12)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(var i=0;i<parts.length;i++){var p=parts[i];p.a+=p.sp;p.tw+=0.05;var x=CX+Math.cos(p.a)*p.r,y=CY+Math.sin(p.a)*p.r*0.9;var al=0.4+Math.sin(p.tw)*0.35;cx.beginPath();cx.arc(x,y,p.sz,0,7);cx.fillStyle='rgba(230,220,255,'+al+')';cx.fill();}
}
function tick(){drawCore();
  for(var i=0;i<pulses.length;i++){var s=pulses[i];s.t+=s.sp;if(s.t>1)s.t-=1;s.c.setAttribute('cx',CX+(s.h.x-CX)*s.t);s.c.setAttribute('cy',CY+(s.h.y-CY)*s.t);s.c.setAttribute('opacity',(0.9*(1-Math.abs(s.t-0.5)*1.2)).toFixed(2));}
  requestAnimationFrame(tick);
}

function load(){
  Promise.all([
    q('cuentas','select=saldo_actual,es_personal,activa,deleted_at'),
    q('pasivos','select=monto,pagado,estado,deleted_at'),
    q('deudores','select=monto'),
    q('matriz_riesgos','select=area_id,estado,riesgo'),
    q('areas','select=id,codigo,nombre')
  ]).then(function(res){
    var cuentas=res[0]||[],pasivos=res[1]||[],deudores=res[2]||[],riesgos=res[3]||[],areas=res[4]||[];
    var caja=cuentas.filter(function(c){return c.activa&&!c.es_personal&&!c.deleted_at;}).reduce(function(s,c){return s+(Number(c.saldo_actual)||0);},0);
    var porPagar=pasivos.filter(function(p){return !p.deleted_at&&p.estado!=='pagado'&&!p.pagado;}).reduce(function(s,p){return s+(Number(p.monto)||0);},0);
    var porCobrar=deudores.reduce(function(s,d){return s+(Number(d.monto)||0);},0);
    var focos=riesgos.filter(function(r){return abierto(r.estado);});
    deptData.direccion={val:short(caja),tip:'Caja '+short(caja)+' · '+focos.length+' focos'};
    deptData.tesoreria={val:short(caja),tip:'Caja '+short(caja)+' · por pagar '+short(porPagar)+' · por cobrar '+short(porCobrar)};
    deptData.obra={val:'45%',tip:'Weliving 45% · losa P6 en curso'};
    deptData.presupuesto={val:'$912.9M',tip:'Ejecutado $912.9M en Weliving'};
    deptData.talento={val:'13',tip:'Nómina máx 13 · asistencia al día'};
    deptData.compras={tip:'Requisiciones y proveedores'};
    deptData.sst={val:focos.length?focos.length+' focos':'ok',alert:focos.length>0,tip:focos.length+' focos abiertos · alturas y dotación'};
    var pill=document.getElementById('pill');
    if(focos.length){pill.className='pill alert';document.getElementById('pilltx').textContent=focos.length+' foco'+(focos.length>1?'s':'')+' que atender';document.getElementById('coreStat').textContent='· '+focos.length+' focos ·';}
    else{document.getElementById('pilltx').textContent='En calma';}
    build();
  });
}
window.addEventListener('resize',function(){cv.width=window.innerWidth;cv.height=window.innerHeight;initCore();build();});
initCore();build();tick();load();
</script>
</body></html>
