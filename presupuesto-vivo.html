<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weliving · Presupuesto en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--ink:#0b1633;--soft:#7d8ca8;--card:#fff;--line:#e6ecf5;--num:'Space Grotesk',ui-sans-serif,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:18px;max-width:960px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .t{font-size:16px;font-weight:800}.top .s{font-size:12px;color:var(--soft)}
.live{font-size:11px;color:#0ea5a5;font-weight:700;display:flex;align-items:center;gap:6px}
.live .d{width:8px;height:8px;border-radius:50%;background:#0ea5a5;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.35}}
.hero{background:linear-gradient(135deg,#0f1e3d,#243b6b 55%,#2f6df0);border-radius:20px;padding:24px 26px;color:#fff;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-50px;top:-50px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(56,214,214,.35),transparent 70%)}
.hero .lbl{font-size:11px;letter-spacing:2px;opacity:.72;font-weight:700}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.hero .foot{font-size:12px;opacity:.75;margin-top:5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-top:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.c:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,40,90,.10)}
.c:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.c.g1:before{background:#0ea5a5}.c.g2:before{background:#10b981}.c.g3:before{background:#e2504a}.c.g4:before{background:#f59e0b}
.c .l{font-size:10px;letter-spacing:.4px;color:var(--soft);font-weight:700;text-transform:uppercase}
.c .v{font-size:21px;font-weight:800;margin-top:3px}
.c .s{font-size:11px;color:#9aa8c4;margin-top:2px}
.panel{display:grid;grid-template-columns:210px 1fr;gap:16px;margin-top:14px}
@media(max-width:640px){.panel{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.box h3{font-size:13px;font-weight:800;margin-bottom:12px}
.ringwrap{display:flex;flex-direction:column;align-items:center}
.etapa{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-size:12.5px}
.etapa .nm{width:96px;font-weight:600}
.etapa .tr{flex:1;height:15px;background:#eef2f8;border-radius:8px;overflow:hidden}
.etapa .fl{height:100%;border-radius:8px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.etapa .pc{width:42px;text-align:right;color:var(--soft);font-weight:700}
.loading{padding:60px;text-align:center;color:var(--soft)}
.hero .big,.c .v,.etapa .pc,#rt{font-family:var(--num);letter-spacing:-.5px;font-feature-settings:'tnum' 1}
</style></head>
<body>
<div class="top"><div><div class="t">🏗️ Weliving · Presupuesto</div><div class="s">Costo real de obra · datos en vivo</div></div><div class="live"><span class="d"></span>en vivo</div></div>
<div id="app"><div class="loading">Cargando datos reales…</div></div>
<script>
var SB='https://dghmgaaprlzpfnpsqzav.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnaG1nYWFwcmx6cGZucHNxemF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzcyMDQsImV4cCI6MjA5NzIxMzIwNH0.kPTDqFX1AaXlxI2G9V9S46KDMWb6Y6tHoMwe0Fujk7k';
var H={apikey:KEY,Authorization:'Bearer '+KEY};
var DOTACION=534620000;
function get(t,q){return fetch(SB+'/rest/v1/'+t+'?'+q,{headers:H}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];});}
function fmt(n){return '$'+Math.round(n||0).toLocaleString('es-CO');}
function etapaDe(nom){var s=(nom||'').toUpperCase();if(s.indexOf('NEGRA')>=0)return 'Negra';if(s.indexOf('GRIS')>=0)return 'Gris';if(s.indexOf('BLANCA')>=0)return 'Blanca';if(s.indexOf('INDIRECTO')>=0)return 'Indirectos';if(s.indexOf('PROYECTO')>=0)return 'Proyecto';return 'Otros';}
Promise.all([
  get('presupuesto_caps','obra_id=eq.weliving&select=num,nombre,ppto,avance'),
  get('gastos','obra=eq.weliving&select=monto,cap_num')
]).then(function(res){
  var caps=res[0]||[],gastos=res[1]||[];
  var pptoTot=caps.reduce(function(s,c){return s+(+c.ppto||0);},0);
  var fisico=caps.reduce(function(s,c){return s+(+c.ppto||0)*(+c.avance||0)/100;},0);
  var noCosto={'X-PREST':1,'X-AJUSTE':1};
  var gastado=gastos.reduce(function(s,g){return noCosto[g.cap_num]?s:s+(+g.monto||0);},0);
  var construccion=caps.filter(function(c){return etapaDe(c.nombre)!=='Proyecto';}).reduce(function(s,c){return s+(+c.ppto||0);},0);
  var fisicoConstr=caps.filter(function(c){return etapaDe(c.nombre)!=='Proyecto';}).reduce(function(s,c){return s+(+c.ppto||0)*(+c.avance||0)/100;},0);
  var pctConstr=construccion?Math.round(fisicoConstr/construccion*100):0;
  var granTotal=pptoTot+DOTACION;
  var faltaEjec=pptoTot-fisico;
  // etapas
  var orden=['Negra','Gris','Blanca','Indirectos','Proyecto'];
  var et={};caps.forEach(function(c){var e=etapaDe(c.nombre);et[e]=et[e]||{p:0,f:0};et[e].p+=(+c.ppto||0);et[e].f+=(+c.ppto||0)*(+c.avance||0)/100;});
  var lote=(et['Proyecto']||{p:0}).p;
  var html='';
  html+='<div class="hero"><div class="lbl">GRAN TOTAL DEL PROYECTO</div><div class="big" id="gt">$0</div><div class="foot">todo incluido · obra + lote + legales + dotación</div></div>';
  html+='<div class="cards">';
  html+='<div class="c g1"><div class="l">Gastado real</div><div class="v" id="k1">$0</div><div class="s">contabilidad · control</div></div>';
  html+='<div class="c g2"><div class="l">Ejecutado físico</div><div class="v" id="k2">$0</div><div class="s">valor de obra construida</div></div>';
  html+='<div class="c g3"><div class="l">Falta por ejecutar</div><div class="v" id="k3">$0</div><div class="s">obra pendiente</div></div>';
  html+='<div class="c g4"><div class="l">Dotación</div><div class="v" id="k4">$0</div><div class="s">'+Math.round(DOTACION/granTotal*100)+'% del total</div></div>';
  html+='</div>';
  html+='<div class="panel"><div class="box ringwrap"><h3 style="align-self:flex-start">Avance de obra</h3>';
  html+='<svg width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="66" fill="none" stroke="#eef2f8" stroke-width="15"/><circle id="ring" cx="80" cy="80" r="66" fill="none" stroke="url(#gr)" stroke-width="15" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7" transform="rotate(-90 80 80)"/><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><text id="rt" x="80" y="78" text-anchor="middle" font-size="32" font-weight="800" fill="#0b1633">0%</text><text x="80" y="99" text-anchor="middle" font-size="10" fill="#7d8ca8">construido</text></svg>';
  html+='<div style="font-size:11px;color:var(--soft);margin-top:8px;text-align:center">de la construcción (sin el lote)</div></div>';
  html+='<div class="box"><h3>Avance por etapa</h3>';
  orden.forEach(function(e){if(!et[e])return;var p=et[e].p,f=et[e].f,pc=p?Math.round(f/p*100):0;var col=e==='Negra'?'linear-gradient(90deg,#4f46e5,#06b6d4)':e==='Indirectos'?'#f59e0b':e==='Proyecto'?'#64748b':'#94a3b8';
    html+='<div class="etapa"><div class="nm">'+e+'</div><div class="tr"><div class="fl" data-w="'+pc+'" style="background:'+col+'"></div></div><div class="pc">'+pc+'%</div></div>';});
  html+='<div style="margin-top:8px"><h3>Composición del costo</h3><div style="display:flex;height:22px;border-radius:8px;overflow:hidden;margin-top:6px">';
  var pcConstr=Math.round(construccion/granTotal*100),pcLote=Math.round(lote/granTotal*100),pcDot=Math.round(DOTACION/granTotal*100);
  html+='<div style="width:'+pcConstr+'%;background:#4f46e5"></div><div style="width:'+pcLote+'%;background:#0ea5a5"></div><div style="width:'+pcDot+'%;background:#f59e0b"></div></div>';
  html+='<div style="font-size:11px;color:var(--soft);margin-top:6px"><b style="color:#4f46e5">■</b> Construcción '+pcConstr+'% &nbsp; <b style="color:#0ea5a5">■</b> Lote+legales '+pcLote+'% &nbsp; <b style="color:#f59e0b">■</b> Dotación '+pcDot+'%</div></div>';
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
  function an(id,tg){var el=document.getElementById(id),s=null;function st(t){if(!s)s=t;var p=Math.min((t-s)/1100,1);el.textContent=fmt(Math.round(tg*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(st);}requestAnimationFrame(st);}
  an('gt',granTotal);an('k1',gastado);an('k2',fisico);an('k3',faltaEjec);an('k4',DOTACION);
  setTimeout(function(){var r=document.getElementById('ring');r.style.transition='stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)';r.style.strokeDashoffset=414.7*(1-pctConstr/100);
    var rt=document.getElementById('rt'),s=null;function st(t){if(!s)s=t;var p=Math.min((t-s)/1300,1);rt.textContent=Math.round(pctConstr*p)+'%';if(p<1)requestAnimationFrame(st);}requestAnimationFrame(st);
    document.querySelectorAll('.fl').forEach(function(f){f.style.width=f.dataset.w+'%';});},250);
}).catch(function(e){document.getElementById('app').innerHTML='<div class="loading">No pude cargar: '+e+'</div>';});
</script>
</body></html>
