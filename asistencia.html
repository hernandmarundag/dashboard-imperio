<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistencia → Nómina</title>
<script>
// Asistencia y Nómina son una sola área. Redirige a la nómina (marca y suma en el mismo lugar).
(function(){
  var qs=location.search||'';
  var rol=new URLSearchParams(qs).get('rol');
  // si viene del campo (ingeniero) o sin rol, entra en modo obra para marcar
  var dest='nomina.html?rol='+(rol||'ing');
  location.replace(dest);
})();
</script>
<style>body{font-family:-apple-system,sans-serif;background:#f4f5fb;color:#1b2030;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.b{text-align:center}.b a{color:#4f46e5;font-weight:700}</style>
</head><body><div class="b"><p>Asistencia y nómina ahora están en un solo lugar…</p>
<p><a href="nomina.html?rol=ing">Ir a Nómina y asistencia →</a></p></div></body></html>
